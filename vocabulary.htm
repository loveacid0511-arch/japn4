            </div>
        </div>

            <div id="options-grid" class="grid grid-cols-1 gap-4">

        </div>

            <button onclick="location.reload()" class="bg-blue-500 text-white px-8 py-3 rounded-full">再試一次</button>

        let currentQuiz = [];

        let score = 0;
        let quizMode = '';
        let wrongWords = JSON.parse(localStorage.getItem('n4_wrong_words') || '[]');

        document.getElementById('wrong-count').innerText = wrongWords.length;

        function startQuiz(mode) {
            quizMode = mode;
            currentIndex = 0;
            score = 0;
            // 隨機選出 10 題
            currentQuiz = [...wordBank].sort(() => 0.5 - Math.random()).slice(0, 10);
            
            document.getElementById('mode-selection').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = currentQuiz[currentIndex];
            const isJpToCh = quizMode === 'jp-to-ch';
            
            document.getElementById('progress').innerText = `題目：${currentIndex + 1} / 10`;
            document.getElementById('question-text').innerText = isJpToCh ? q.jp : q.ch;

            // 生成選項（1個正確 + 3個隨機錯誤）
            let options = [q];
            while(options.length < 4) {
                let randomWord = wordBank[Math.floor(Math.random() * wordBank.length)];
                if(!options.includes(randomWord)) options.push(randomWord);
            }
            options.sort(() => 0.5 - Math.random());

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-4 border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all text-lg";
                btn.innerText = isJpToCh ? opt.ch : opt.jp;
                btn.onclick = () => checkAnswer(opt === q, q);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect, questionObj) {
            if (isCorrect) {
                score += 10;
                alert("正解！");
            } else {
                alert(`可惜！正確答案是：${quizMode === 'jp-to-ch' ? questionObj.ch : questionObj.jp}`);
                // 加入錯題庫（檢查是否重複）
                if (!wrongWords.some(w => w.jp === questionObj.jp)) {
                    wrongWords.push(questionObj);
                    localStorage.setItem('n4_wrong_words', JSON.stringify(wrongWords));
                }
            }
            
            currentIndex++;
            if (currentIndex < 10) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            document.getElementById('final-score').innerText = `你的得分是：${score} / 100`;
        }

                return;
            }
            let list = wrongWords.map(w => `${w.jp} : ${w.ch}`).join('\n');
            alert("你的錯字庫：\n" + list);
        }
    </script>
